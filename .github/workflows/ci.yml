name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (aus .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (npm ci)
        run: npm ci

      - name: Syntax-Check (alle JS-Dateien)
        run: |
          for f in src/*.js scripts/*.js public/js/*.js test/*.js; do
            echo "checking $f"
            node --check "$f"
          done

      - name: Unit-Tests (node --test)
        run: npm test
